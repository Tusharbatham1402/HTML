<!DOCTYPE html>
<html>
    <head>
        <style>
            .py
            {
               text-align:right ;
                display: inline;
            }
        </style>
        <title>List</title>
        <body>
            <h1>1. Unordered List</h1>

            <ul type="circle">
                <li>Lion</li>  <li>python</li>
                <li>Tiger</li>
                <li>Panther</li>
            </ul>

            <h1>2. Ordered List</h1>

            <ol type="A">
                <li>Fox</li>
                <dd>i. Fox have four legs.</dd>
                <li>Hyna</li>
                <li>Giraffe</li>
            </ol>

            <h1>Descriptive List</h1>

            <dl>
                <dt>-List</dt>
                <dd>There are 3 types of list</dd>
                <dd>Ordered, Unordered, Descriptive</dd>
                <dt>-India</dt>
                <dd>India is a developing country.</dd>
                <dd>Rajasthan is biggest state of India.</dd>
            </dl>
        </body>
    </head>
</html>
